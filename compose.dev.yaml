# Local development services. Start with `just up`; see the justfile.
name: fpa-events-dev

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # Override the host port (e.g. for a throwaway smoke test) with POSTGRES_HOST_PORT.
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    environment:
      # Must match DATABASE_URL in .env.example and .env.test.
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fpa_events
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      # Runs once, when the data volume is first created.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d fpa_events']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
