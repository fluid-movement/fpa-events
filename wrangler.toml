name = "fpa-event-app"
main = "src/index.ts"
compatibility_date = "2022-11-07"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
# For LOCAL development: Wrangler will automatically create a local D1 database
# For PRODUCTION: Configure the D1 binding through the Cloudflare Pages/Workers dashboard
#   - Go to your Pages/Workers project settings
#   - Add a D1 binding named "DB" pointing to your production database
[[ d1_databases ]]
binding = "DB"
